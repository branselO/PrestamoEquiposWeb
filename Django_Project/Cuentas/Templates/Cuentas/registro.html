{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Touch ID</title>
    <!-- 1. Importamos la librería traductora mediante un CDN -->
    <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
    <link rel="stylesheet" href="{% static 'Cuentas/css/register.css' %}">
</head>
<body>
    <div class="login-card">
        <!-- Enlace discreto para regresar -->
        <a href="{% url 'login_web' %}" class="back-link">← Volver al login</a>

        <h2>Crear Cuenta</h2>
        <p class="subtitle">Ingresa tus datos y guarda tu huella digital</p>
        
        {% csrf_token %}

        <div class="input-group">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre">
        </div>

        <div class="input-group">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="ejemplo@correo.com">
        </div>

        <div id="video-container">
            <video id="video-stream" autoplay playsinline></video>
        </div>
        
        <button id="btn-toggle-camera" class="btn-small">📷 Encender / Apagar Cámara</button>

        <canvas id="canvas-capture" width="640" height="480" style="display: none;"></canvas>

        <button id="btn-registrar" class="btn-primary">Registrarme</button>
    </div>
</body>
</html>
