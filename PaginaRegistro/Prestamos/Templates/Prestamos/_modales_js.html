<script>
    document.querySelectorAll('[data-open-return]').forEach((button) => {
        button.addEventListener('click', () => document.getElementById(button.dataset.openReturn).showModal());
    });
    document.querySelectorAll('[data-close-return]').forEach((button) => {
        button.addEventListener('click', () => button.closest('dialog').close());
    });
    document.querySelectorAll('dialog.modal').forEach((dialog) => {
        dialog.addEventListener('click', (event) => {
            if (event.target === dialog) dialog.close();
        });
    });
    document.querySelectorAll('[data-auth-form]').forEach((form) => {
        const actualizar = () => {
            const huella = form.elements['metodo'].value === 'huella';
            const correo = form.querySelector('[data-auth-email] input[name="correo"]');
            const contrasena = form.querySelector('[data-auth-pass] input[name="contrasena"]');
            const email = form.querySelector('[data-auth-email]');
            const pass = form.querySelector('[data-auth-pass]');
            const sensor = form.querySelector('[data-auth-huella]');
            if (email) email.classList.toggle('hidden', huella);
            if (correo) correo.required = !huella;
            if (pass) pass.classList.toggle('hidden', huella);
            if (contrasena) contrasena.required = !huella;
            if (sensor) sensor.classList.toggle('hidden', !huella);
        };
        form.addEventListener('change', actualizar);
        actualizar();
    });
</script>
