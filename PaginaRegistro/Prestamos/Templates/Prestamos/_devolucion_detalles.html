<fieldset class="border-0 p-0">
    <legend class="mb-2 text-sm font-semibold text-slate-800">Dispositivos a devolver</legend>
    {% for detalle in prestamo.detalles.all %}
        {% if not detalle.fecha_devuelto %}
            <label class="flex items-start gap-3 py-1 text-sm text-slate-800">
                <input type="checkbox" class="mt-0.5 h-4 w-4 accent-unam-600" name="detalles" value="{{ detalle.id }}" checked>
                <span>{{ detalle.dispositivo.codigo_inventario }} — {{ detalle.dispositivo.nombre }}</span>
            </label>
        {% endif %}
    {% endfor %}
</fieldset>
<div>
    <label class="field-label" for="comentarios-dev-{{ prestamo.id }}">Comentarios del préstamo</label>
    <textarea id="comentarios-dev-{{ prestamo.id }}" class="field min-h-24" name="comentarios" placeholder="Ej: Pantalla rayada, cargador incompleto…"></textarea>
</div>
