<div data-auth-email>
    <label class="field-label" for="correo-{{ prefijo }}">Correo</label>
    <input id="correo-{{ prefijo }}" class="field" type="email" name="correo" value="{{ correo|default:'' }}" required autocomplete="email" placeholder="correo@ejemplo.com">
</div>
<div data-auth-pass>
        <label class="field-label" for="contrasena-{{ prefijo }}">Contraseña</label>
        <input id="contrasena-{{ prefijo }}" class="field" type="password" name="contrasena" autocomplete="current-password" required>
    </div>
<fieldset class="space-y-4 border-0 p-0" data-auth-fields>
    <legend class="text-sm font-semibold text-ink dark:text-slate-100">Método de autenticación</legend>
    <div class="grid gap-3 sm:grid-cols-2">
        <label class="choice">
            <input type="radio" class="sr-only" name="metodo" value="huella" {% if metodo != 'contrasena' %}checked{% endif %}>
            <span class="choice-icon" aria-hidden="true">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 11a3 3 0 0 0-3 3c0 2.5 1.2 4.2 1.2 6"></path><path d="M12 7a7 7 0 0 0-7 7c0 2 .4 3.5.8 4.8"></path><path d="M12 3a11 11 0 0 0-11 11"></path><path d="M16.5 8.5a6 6 0 0 1 1.5 4c0 1.6-.3 3-.7 4.2"></path><path d="M18 20c.6-1.6 1-3.4 1-5.5A7 7 0 0 0 8.2 8"></path></svg>
            </span>
            <span>
                <span class="choice-title">Huella digital</span>
                <span class="choice-help">Al continuar, coloca el dedo en el sensor.</span>
            </span>
        </label>
        <label class="choice">
            <input type="radio" class="sr-only" name="metodo" value="contrasena" {% if metodo == 'contrasena' %}checked{% endif %}>
            <span class="choice-icon" aria-hidden="true">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
            </span>
            <span>
                <span class="choice-title">Correo y Contraseña</span>
                <span class="choice-help">Identificación manual.</span>
            </span>
        </label>
    </div>
    
    <div data-auth-huella class="hidden space-y-3">
        <p class="callout">Al pulsar el botón, apoya el centro del dedo cuando este recuadro lo pida y no lo muevas hasta que diga que está leyendo.</p>
        <div data-auth-estado class="status-box info" role="status">Listo para buscar. Pulsa el botón y después apoya el dedo.</div>
    </div>
</fieldset>
