{% extends 'Usuarios/base.html' %}
{% load static %}

{% block title %}Registrar usuario{% endblock %}

{% block content %}
<section class="mx-auto w-full max-w-xl">
    <header class="mb-6">
        <p class="kicker">Usuarios</p>
        <h1 class="page-title">Registrar usuario</h1>
        <p class="page-lead">Como miembro del staff, puedes registrar cuentas estándar desde aquí.</p>
    </header>
    <form class="form-stack panel p-5 sm:p-6" method="post" data-programs-url="{% url 'programas_por_entidad' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block">Crear cuenta normal</button>
    </form>
</section>
<script src="{% static 'Usuarios/js/programas_por_entidad.js' %}" defer></script>
{% endblock %}
