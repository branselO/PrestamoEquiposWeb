{% extends "Usuarios/base.html" %}
{% load static %}

{% block title %}Editar Usuario{% endblock %}

{% block content %}
<section class="mx-auto w-full max-w-xl">
    <header class="mb-6">
        <p class="kicker">Usuarios</p>
        <h1 class="page-title">Editar usuario</h1>
    </header>
    <form class="form-stack panel p-5 sm:p-6" method="post" data-entities-url="{% url 'entidades_por_programa' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block">Guardar cambios</button>
    </form>
</section>
<script src="{% static 'Usuarios/js/entidades_por_programa.js' %}" defer></script>
{% endblock %}
